name: Echo booking restoration checks
on:
  push:
    branches: [fix/echo-booking-restoration-20261103]
  pull_request:
    paths:
      - 'new-booking-code/**'
      - '.github/workflows/echo-booking-restoration-check.yml'
jobs:
  syntax-and-regions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9d1a9cdf3 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --check new-booking-code/booking-v2.js
      - run: node --check new-booking-code/review-restore.js
      - run: node --check new-booking-code/native-receipt-restore.js
      - run: node --check new-booking-code/confirmation-restore.js
      - run: node --test new-booking-code/booking-regions.test.cjs
